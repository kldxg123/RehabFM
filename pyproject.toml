[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "rehabfm-research"
version = "0.1.1"
description = "RehabFM multimodal rehabilitation classification research code"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.24"]
[tool.setuptools.packages.find]
where = ["src"]
